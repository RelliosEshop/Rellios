<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Impostor Game</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #121212;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    padding: 20px;
     flex-direction: column;
       height: 100%;

  justify-content: flex-start; /* start from top for smaller screens */
  }
.container {
  width: 100%;
  max-width: 400px;
  background: #1e1e1e;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 0 10px rgba(0,0,0,0.3);
  display: flex;
  flex-direction: column;
    max-height: calc(100vh - 150px); /* leave space for image above */

  
}
  label { 
    display: block; 
    margin-bottom: 8px; 
    font-size: 1rem; 
  }
  input, select, button {
    
    width: calc(100% - 24px); /* Reduced width with padding consideration */
    padding: 12px;
    margin-bottom: 16px;
    border-radius: 8px;
    border: none;
    font-size: 1rem;
    box-sizing: border-box; /* Ensures padding is included in width calculation */
  }
input, select {
      background: #2a2a2a; 
    color: #fff;   
  width: calc(100% - 24px);
  padding: 12px;
  margin-bottom: 16px;
  border-radius: 8px;
  border: none;
  font-size: 1rem;
  box-sizing: border-box;
  margin-left: auto;
  margin-right: auto;
  display: block;
}
  button { 
    margin-left: auto;
  margin-right: auto;
  display: block;
    background: #4caf50; 
    color: white; 
    cursor: pointer; 
    font-weight: bold; 
  }
  button:disabled { 
    background: #555; 
    cursor: not-allowed; 
  }
  .overlay {
    position: fixed; 
    top:0; 
    left:0; 
    width:100%; 
    height:100%;
    background: rgba(0,0,0,0.8);
    display: none; 
    justify-content: center; 
    align-items: center;
  }
  .card { 
    background:#1e1e1e; 
    padding:20px; 
    border-radius:12px; 
    text-align:center; 
    width:80%; 
    max-width:300px; 
    
  }
.checkboxRow {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
  align-items: center; /* ensures both label blocks align vertically */
}

/* make each label a horizontal flex row and prevent wrapping */
.checkboxRow label {
  display: inline-flex;
  align-items: center;   /* <-- vertically center checkbox + text */
  gap: 8px;
  white-space: nowrap;   /* keep label text on one line */
  font-size: 0.95rem;
  line-height: 1;        /* keep line-height tight so text centers with input */
}
.responsive-img {
   max-width: 100%;  /* scales with screen width */
   height: auto;     /* keeps aspect ratio */
   margin-bottom: 20px; /* space between image and container */
 }
/* size the native checkbox so it lines up with text */
.checkboxRow input[type="checkbox"] {
  width: 18px;
  height: 18px;
  margin: 0;             /* remove default margins that push it off */
  display: inline-block;
  vertical-align: middle;
  /* optional: make the checkbox color match your theme (modern browsers) */
  accent-color: #4caf50;
}
@media (max-height: 500px) {
  .responsive-img { max-height: 15vh; }
  .container { max-height: 75vh; }
}
/* small tweak for older Safari / some mobile UIs: nudge the checkbox slightly */
@supports(-webkit-appearance: none) {
  .checkboxRow input[type="checkbox"] {
    transform: translateY(1px);
  }
}


</style>
</head>
<body>
 <img id="stageImage" class="responsive-img" style="display:none;">
<div class="container" id="gameContainer">
  <form autocomplete="off">
    <label for="players">How many players?</label>
    <input type="number" id="players" min="2" max="20" placeholder="Enter number of players" autocomplete="off">

    <label for="impostors">How many impostors?</label>
    <select id="impostors" disabled autocomplete="off"></select>

    <div class="checkboxRow">
        <label><input type="checkbox" id="showHint" checked> Βοήθεια</label>
        <label><input type="checkbox" id="showCategory" checked> Κατηγορία</label>
    </div>

    <button id="nextBtn" disabled>Next</button>
  </form>
</div>

<script>
const container = document.getElementById("gameContainer");
const playersInput = document.getElementById("players");
const impostorsSelect = document.getElementById("impostors");
const nextBtn = document.getElementById("nextBtn");

let wordsData = [];
let currentGame = {
  names: [],
  impostorCount: 0,
  secretWord: '',
  hint: '',
  impostors: []
};

function setStageImage(src) {
  const img = document.getElementById("stageImage");
  if (!src) {
    img.style.display = "none";
    return;
  }
  img.src = src;
  img.style.display = "block";
}
setStageImage("image1.jpg");
// Load words.json
fetch('words.json')
  .then(resp => resp.json())
  .then(data => wordsData = data)
  .catch(err => { console.error(err); alert("Failed to load words.json"); });

// Enable Next button and impostors when players input valid
playersInput.addEventListener("input", () => {
  let numPlayers = parseInt(playersInput.value);

  // Clamp the value between 2 and 20
  if(isNaN(numPlayers) || numPlayers < 2) {
    numPlayers = 3;
  } else if(numPlayers > 20) {
    numPlayers = 20;
  }

  // Update the input field to reflect the clamped value
  playersInput.value = numPlayers;

  // Enable/disable impostor select and Next button
  if(numPlayers >= 2){
    impostorsSelect.disabled = false;

    // Generate impostor options dynamically
    impostorsSelect.innerHTML = '';
    const maxImpostors = numPlayers - 2; // at least 2 more players than impostors
    for(let i=1; i<=maxImpostors; i++){
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = i;
      impostorsSelect.appendChild(opt);
    }

    nextBtn.disabled = false;
  } else {
    impostorsSelect.disabled = true;
    nextBtn.disabled = true;
  }
});


nextBtn.addEventListener("click", () => {
  const players = parseInt(playersInput.value);
  const impostors = parseInt(impostorsSelect.value);
  currentGame.impostorCount = impostors;
  currentGame.showHint = document.getElementById("showHint").checked;
  currentGame.showCategory = document.getElementById("showCategory").checked;

  showNameScreen(players, impostors);
});

// Stage 2: enter player names
function showNameScreen(players, impostorCount){
  setStageImage(null);
  let html = `<h2>Enter Player Names</h2>`;
  for(let i=1;i<=players;i++){
    html += `<label>Player ${i}</label>
             <input type="text" id="player_${i}" maxlength="7" value="Player${i}" />`;
  }
  html += `<button id="confirmBtn">Confirm</button>`;
  container.innerHTML = html;

  document.getElementById("confirmBtn").addEventListener("click", ()=>{
    currentGame.names = [];
    for(let i=1;i<=players;i++){
      const name = document.getElementById(`player_${i}`).value.trim() || `Player${i}`;
      currentGame.names.push(name);
    }
    showWordScreen();
  });
}
// ===============================
// LOCAL STORAGE WORD SAVING
// ===============================

// Load used words from localStorage
function loadUsedWords() {
  const data = localStorage.getItem("usedWords");
  return data ? JSON.parse(data) : [];
}

// Save a word as used
function saveUsedWord(word) {
  const used = loadUsedWords();
  used.push(word);
  localStorage.setItem("usedWords", JSON.stringify(used));
}

// Reset used words (if all words have been played)
function resetUsedWords() {
  localStorage.removeItem("usedWords");
}

// Pick a NEW unused word
function pickNewWord() {
  const used = loadUsedWords();

  // Filter unused words
  const unused = wordsData.filter(entry => !used.includes(entry.word));

  // If all played → reset and restart
  if (unused.length === 0) {
    resetUsedWords();
    alert("Όλες οι λέξεις παίχτηκαν! Η λίστα ανανεώθηκε.");
    return pickNewWord();
  }

  // Choose random unused entry
  const choice = unused[Math.floor(Math.random() * unused.length)];

  // Save it to localStorage
  saveUsedWord(choice.word);

  return choice;
}

// Stage 3: show word/impostors (replace your existing function)
function showWordScreen() {
  setStageImage(null);
  
  if (wordsData.length === 0) { alert("No words loaded."); return; }

  const randomEntry = pickNewWord();
  currentGame.secretWord = randomEntry.word;
  currentGame.hint = randomEntry.hint;
  currentGame.category = randomEntry.category;

  // pick impostors
  currentGame.impostors = [];
  while (currentGame.impostors.length < currentGame.impostorCount) {
    const pick = Math.floor(Math.random() * currentGame.names.length);
    if (!currentGame.impostors.includes(pick)) currentGame.impostors.push(pick);
  }

  let viewedCount = 0;
  let html = `<h2>Who will view the word?</h2>`;
  currentGame.names.forEach((n,i) => {
    html += `<button class="playerBtn" data-id="${i}" id="btn_${i}">${n}</button>`;
  });
  container.innerHTML = html;

  // remove old popup if any
  const oldPopup = document.querySelector(".overlay");
  if (oldPopup) oldPopup.remove();

  // create popup skeleton (content will be filled on reveal)
  const popup = document.createElement("div");
  popup.className = "overlay";
  popup.innerHTML = `
    <div class="card">
      <div id="popupMeta" style="margin-bottom:6px"></div>
      <p id="popupWord" style="font-size:1.3rem; margin:16px 0;"></p>
      <button id="closePopup">OK</button>
    </div>
  `;
  document.body.appendChild(popup);

  // helper: robust checkbox getter (supports multiple possible ids)
  function checkboxChecked(...ids) {
    for (const id of ids) {
      const el = document.getElementById(id);
      if (el) return !!el.checked;
    }
    // fallback to currentGame flags if present, otherwise true
    if (typeof currentGame.showHint !== 'undefined' && typeof currentGame.showCategory !== 'undefined') {
      // if caller asked for a hint check, caller should pass which flag is requested
      // but here we just return undefined to let caller decide
      return undefined;
    }
    return undefined;
  }

  // Better: explicit functions for hint/category so we can fallback consistently
  function isShowHint() {
    // check multiple possible checkbox ids
    const byId = (document.getElementById("showHint") || document.getElementById("showHintCheckbox"));
    if (byId) return !!byId.checked;
    // fallback to currentGame flag if set
    if (typeof currentGame.showHint !== 'undefined') return !!currentGame.showHint;
    // default: true
    return true;
  }
  function isShowCategory() {
    const byId = (document.getElementById("showCategory") || document.getElementById("showCategoryCheckbox"));
    if (byId) return !!byId.checked;
    if (typeof currentGame.showCategory !== 'undefined') return !!currentGame.showCategory;
    return true;
  }

  // Add listeners to player buttons
  document.querySelectorAll(".playerBtn").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = parseInt(btn.dataset.id);
      const showHint = isShowHint();
      const showCategory = isShowCategory();

      // popupMeta: show category only if enabled
      const metaEl = document.getElementById("popupMeta");
      metaEl.innerHTML = showCategory ? `<small style="display:block">Κατηγορία: <strong>${currentGame.category}</strong></small>` : "";

      // fill popupWord depending on role
      const wordEl = document.getElementById("popupWord");
      if (currentGame.impostors.includes(id)) {
        // Impostor view (word hidden)
        const hintHtml = showHint ? `<div style="margin-top:8px;"><small>Hint: ${currentGame.hint}</small></div>` : "";
        wordEl.innerHTML = `<h2><span style="color:red; font-weight:bold;">Impostor</span></h2>${hintHtml}`;
      } else {
        // Normal player view (word shown)
        const hintHtml = showHint ? `<div style="margin-top:8px;"><small>Hint: ${currentGame.hint}</small></div>` : "";
        wordEl.innerHTML = `<h2><span style="color:green; font-weight:bold;">${currentGame.secretWord}</span></h2>${hintHtml}`;
      }

      popup.style.display = "flex";
      btn.disabled = true;
      viewedCount++;
    });
  });

  // close button
  popup.querySelector("#closePopup").addEventListener("click", () => {
    popup.style.display = "none";
    if (viewedCount === currentGame.names.length) {
      showAllViewedScreen();
    }
  });

  // click outside to close
  popup.addEventListener("click", e => { if (e.target === popup) popup.style.display = "none"; });
}




// Stage 4
function showAllViewedScreen(){
  setStageImage(null);
  setStageImage("image2.jpg");
  let html = `<h2>All players have seen their words!</h2>`;
  html += `<button id="showResultsBtn">Show Results</button>`;
  container.innerHTML = html;
  document.getElementById("showResultsBtn").addEventListener("click", showResultsScreen);
}

// Stage 5: results
// Stage 5: results
function showResultsScreen() {

  setStageImage(null);
  setStageImage("image3.webp");

  // Read stored settings, NOT deleted checkboxes
  const showHint = currentGame.showHint;
  const showCategory = currentGame.showCategory;

  let html = `<center><h2>Results</h2></center>`;
  html += `<p><strong>Word:</strong> ${currentGame.secretWord}</p>`;

  if (showHint)
    html += `<p><strong>Hint:</strong> ${currentGame.hint}</p>`;

  if (showCategory)
    html += `<p><strong>Category:</strong> ${currentGame.category}</p>`;

  html += `<p><strong>Impostor(s):</strong> ${currentGame.impostors.map(i => currentGame.names[i]).join(", ")}</p>`;

  html += `<button id="playAgainBtn">Play Again</button>`;
  html += `<button id="startOverBtn">Start Over</button>`;

  container.innerHTML = html;

  document.getElementById("playAgainBtn").addEventListener("click", showWordScreen);
  document.getElementById("startOverBtn").addEventListener("click", resetGame);
}





function resetGame() {
  // Refresh the page to start over
  location.reload();
}



</script>
</body>
</html>
